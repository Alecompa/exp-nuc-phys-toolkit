# Android and desktop (Linux, Windows, macOS) builds of the Kotlin Multiplatform app in multiplatform/.
# Each run tests the Kotlin physics against Shared/reference_values.json and uploads the APK and installers.
name: Android & desktop

on:
  push:
    paths: ["multiplatform/**", "Shared/**", "Packages/NucToolkit/Sources/NucPhysKit/Resources/**", ".github/workflows/multiplatform.yml"]
  pull_request:
    paths: ["multiplatform/**", "Shared/**", "Packages/NucToolkit/Sources/NucPhysKit/Resources/**", ".github/workflows/multiplatform.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: multiplatform

jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Physics tests (same reference values as the Swift package)
        run: ./gradlew :composeApp:desktopTest --console=plain
      - name: Debug APK
        run: ./gradlew :composeApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: gamow-android-debug-apk, path: multiplatform/composeApp/build/outputs/apk/debug/*.apk }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, task: packageDeb, out: deb }
          - { os: windows-latest, task: packageMsi, out: msi }
          - { os: macos-latest, task: packageDmg, out: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest :composeApp:${{ matrix.task }} --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: gamow-desktop-${{ matrix.out }}, path: multiplatform/composeApp/build/compose/binaries/main/${{ matrix.out }}/* }
